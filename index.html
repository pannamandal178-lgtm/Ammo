<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalLearn</title>
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* Base styles from index.css */
        :root {
            --bg: #05050f;
            --surface: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --accent: #00ff88;
        }

        :root.light {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            background-color: #000;
            font-family: 'Outfit', sans-serif;
            color: var(--text);
        }

        #root {
            width: 100%;
            max-width: 430px;
            background-color: var(--bg);
            position: relative;
            min-height: 100vh;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.05);
        }

        .glass-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1rem;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Tailwind Configuration */
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: 'var(--accent)',
                        background: 'var(--bg)',
                        surface: 'var(--surface)',
                        border: 'var(--border)',
                        'text-primary': 'var(--text)',
                        'text-muted': 'var(--text-muted)',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "motion/react": "https://esm.sh/motion@11.0.8/react",
        "react-hot-toast": "https://esm.sh/react-hot-toast@2.4.1",
        "clsx": "https://esm.sh/clsx@2.1.0",
        "tailwind-merge": "https://esm.sh/tailwind-merge@2.2.1"
      }
    }
    </script>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import ReactDOM from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from 'firebase/auth';
        import { 
            getFirestore, doc, onSnapshot, setDoc, getDoc, updateDoc, 
            collection, addDoc, query, orderBy, limit, getDocs, 
            writeBatch, where, increment 
        } from 'firebase/firestore';
        import * as Lucide from 'lucide-react';
        import { motion, AnimatePresence } from 'motion/react';
        import { Toaster, toast } from 'react-hot-toast';
        import { clsx } from 'clsx';
        import { twMerge } from 'tailwind-merge';

        // --- Firebase Config (Pre-filled for your app) ---
        const firebaseConfig = {
            projectId: "gen-lang-client-0364476735",
            appId: "1:1043725152814:web:f15122e819e7f0310fe5bf",
            apiKey: "AIzaSyBAPmvu-T0S13cQo9Sju1REy_hFBpGRyBM",
            authDomain: "gen-lang-client-0364476735.firebaseapp.com",
            storageBucket: "gen-lang-client-0364476735.firebasestorage.app",
            messagingSenderId: "1043725152814"
        };
        const firestoreDatabaseId = "ai-studio-dce5842f-75e4-4add-83f7-2e2408eb3f58";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app, firestoreDatabaseId);

        // --- Constants & Utils ---
        const COINS_PER_AD = 10;
        const COINS_PER_QUIZ = 10;
        const COINS_DAILY_BONUS = 10;
        const DAILY_AD_LIMIT = 25;
        const DAILY_QUIZ_LIMIT = 15;
        const AD_COOLDOWN_MS = 10000;
        const REFERRAL_BONUS = 170;
        const WD_UPI_COINS = 2300;
        const WD_GIFT_COINS = 2000;

        function cn(...inputs) { return twMerge(clsx(inputs)); }
        function formatCurrency(coins) { return `₹${(coins / 100).toFixed(2)}`; }
        function getTodayDateString() { return new Date().toISOString().split('T')[0]; }

        const { 
            Home, Gift, Users, Trophy, User: UserIcon, Wallet, Settings, 
            X, Check, Globe, Save, CheckCircle2, AlertCircle, LogOut, 
            ChevronRight, TrendingUp, Brain, Video, Copy, Share2, 
            Clock, Lock, Sun, Moon, ArrowUpRight, ArrowDownRight, 
            Loader2, Bell, Star 
        } = Lucide;

        // --- Core Application Logic ---
        function App() {
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('home');
            const [showWithdraw, setShowWithdraw] = useState(false);
            const [appConfig, setAppConfig] = useState({ appName: 'HalalLearn' });

            useEffect(() => {
                const unsub = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (u) {
                        onSnapshot(doc(db, 'users', u.uid), (snap) => {
                            if (snap.exists()) {
                                setUserData(snap.data());
                                setLoading(false);
                            } else {
                                // Logic to create new user data
                                setLoading(false);
                            }
                        });
                    } else {
                        setLoading(false);
                    }
                });
                return unsub;
            }, []);

            if (loading) return <div className="h-screen flex items-center justify-center"><Loader2 className="animate-spin text-accent" /></div>;

            if (!user) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center space-y-6 px-8">
                        <div className="w-20 h-20 bg-accent rounded-3xl flex items-center justify-center shadow-lg shadow-accent/20">
                            <TrendingUp className="text-black" size={40} />
                        </div>
                        <h1 className="text-4xl font-bold text-white tracking-tight">{appConfig.appName}</h1>
                        <button 
                            onClick={() => signInWithPopup(auth, new GoogleAuthProvider())}
                            className="w-full h-14 bg-accent text-black font-bold rounded-2xl flex items-center justify-center gap-3"
                        >
                            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-5" />
                            Sign in with Google
                        </button>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col">
                    <Toaster position="top-center" />
                    <main className="flex-1 p-6">
                        <header className="flex justify-between items-center mb-8">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-accent/20 rounded-full border border-accent/20" />
                                <div>
                                    <p className="text-sm font-bold text-white">{userData?.name || "User"}</p>
                                    <p className="text-xs text-gray-400">Balance: {userData?.coins} coins</p>
                                </div>
                            </div>
                            <button onClick={() => signOut(auth)}><LogOut className="text-gray-500" /></button>
                        </header>

                        {/* App Screens would go here - for full code refer to standalone.html in your files */}
                        <div className="glass-card p-8 text-center space-y-4">
                            <Trophy size={48} className="mx-auto text-accent" />
                            <h2 className="text-2xl font-bold">Welcome Back!</h2>
                            <p className="text-sm text-gray-400">Start tasks or refer friends to earn more coins.</p>
                        </div>
                    </main>

                    <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] h-20 bg-background/80 backdrop-blur-xl border-t border-white/5 flex items-center justify-around">
                        <button onClick={() => setActiveTab('home')} className={activeTab === 'home' ? 'text-accent' : 'text-gray-500'}><Home /></button>
                        <button onClick={() => setActiveTab('offers')} className={activeTab === 'offers' ? 'text-accent' : 'text-gray-500'}><Gift /></button>
                        <button onClick={() => setActiveTab('refer')} className={activeTab === 'refer' ? 'text-accent' : 'text-gray-500'}><Users /></button>
                        <button onClick={() => setActiveTab('profile')} className={activeTab === 'profile' ? 'text-accent' : 'text-gray-500'}><UserIcon /></button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
